<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite para o Cinema ♡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #d8b4fe, #8b5cf6);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .card {
            background-color: #faf7ff;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(76, 29, 149, 0.2);
            text-align: center;
            z-index: 20;
            position: relative;
            max-width: 420px;
            width: 100%;
        }

        .question {
            font-family: 'Dancing Script', cursive;
            font-size: 38px;
            font-weight: 700;
            color: #5b21b6;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 50px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        #yes {
            background-color: #8b5cf6;
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        #yes:hover {
            background-color: #7c3aed;
        }

        #no {
            background-color: #ef4444;
            color: white;
        }

        #no.moving {
            position: fixed;
            transition: top 0.25s ease-out, left 0.25s ease-out;
            z-index: 100;
        }

        #success-message {
            display: none;
            background-color: #faf7ff;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(76, 29, 149, 0.2);
            text-align: center;
            z-index: 30;
            max-width: 420px;
            width: 100%;
        }

        #success-message h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 42px;
            color: #4c1d95;
            margin: 0 0 10px 0;
        }

        #success-message p {
            font-size: 16px;
            color: #6d28d9;
            margin-bottom: 15px;
        }

        .genre-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 18px 0;
        }

        .genre-btn {
            background-color: #ede9fe;
            color: #5b21b6;
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .genre-btn.selected {
            background-color: #7c3aed;
            color: white;
            transform: scale(1.05);
        }

        .whatsapp-btn {
            display: inline-block;
            background-color: #22c55e;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: background-color 0.2s ease;
        }

        .whatsapp-btn:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <div class="question">
            Topa um cineminha amanhã? ♡
        </div>
        <div class="buttons-container">
            <button id="yes">Sim!</button>
            <button id="no">Não</button>
        </div>
    </div>

    <div id="success-message">
        <h2>Combinado! ♡</h2>
        <p>Te vejo amanhã! Qual estilo de filme você prefere?</p>

        <div class="genre-options">
            <button type="button" class="genre-btn" onclick="selecionarOpcao(this, 'Comédia 😂')">Comédia 😂</button>
            <button type="button" class="genre-btn" onclick="selecionarOpcao(this, 'Ação 💥')">Ação 💥</button>
            <button type="button" class="genre-btn" onclick="selecionarOpcao(this, 'Terror 👻')">Terror 👻</button>
            <button type="button" class="genre-btn" onclick="selecionarOpcao(this, 'Romance 🥰')">Romance 🥰</button>
            <button type="button" class="genre-btn" onclick="selecionarOpcao(this, 'Você escolhe 🎲')">Você escolhe 🎲</button>
        </div>

        <a id="wpp-link" class="whatsapp-btn" href="#" target="_blank">
            Confirmar no WhatsApp 💬
        </a>
    </div>

    <audio id="musica-sucesso" src="07 Obliviate.mp3" preload="auto"></audio>

    <script>
        const seuNumeroWhatsApp = "5571996758195"; 
        let opcaoEscolhida = "qualquer filme";
        let tentativas = 0;
        let yesScale = 1;

        const frasesNo = [
            "Tem certeza?",
            "Pensa bem...",
            "Eu pago a pipoca!",
            "Botão errado!",
            "Tenta o outro 😉",
            "Não desiste de mim!"
        ];

        const btnNo = document.getElementById('no');
        const btnYes = document.getElementById('yes');
        const mainCard = document.getElementById('main-card');
        const successMsg = document.getElementById('success-message');
        const audio = document.getElementById('musica-sucesso');

        function moverBotao() {
            btnNo.classList.add('moving');
            const padding = 20;
            const maxX = window.innerWidth - btnNo.offsetWidth - padding;
            const maxY = window.innerHeight - btnNo.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';

            btnNo.textContent = frasesNo[tentativas % frasesNo.length];
            tentativas++;

            yesScale = Math.min(yesScale + 0.15, 2.0);
            btnYes.style.transform = `scale(${yesScale})`;
        }

        btnNo.addEventListener('mouseover', moverBotao);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moverBotao();
        });

        btnYes.addEventListener('click', () => {
            mainCard.style.display = 'none';
            btnNo.style.display = 'none';
            successMsg.style.display = 'block';
            atualizarLinkWhatsApp();

            audio.play().catch(err => console.log("Erro ao tocar áudio:", err));

            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        });

        function selecionarOpcao(botao, escolha) {
            document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('selected'));
            botao.classList.add('selected');
            opcaoEscolhida = escolha;
            atualizarLinkWhatsApp();
        }

        function atualizarLinkWhatsApp() {
            const mensagem = `Oi! Aceito o convite para o cinema amanhã! 🍿🎬 Minha escolha é: ${opcaoEscolhida}`;
            const textoCodificado = encodeURIComponent(mensagem);
            document.getElementById('wpp-link').href = `https://wa.me/${seuNumeroWhatsApp}?text=${textoCodificado}`;
        }

        atualizarLinkWhatsApp();
    </script>
</body>
</html>
